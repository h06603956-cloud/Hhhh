name: macOS noVNC via Tailscale

on:
  workflow_dispatch:

jobs:
  run-novnc:
    runs-on: macos-14

    steps:
      - name: Install Tailscale & Git
        run: |
          brew install tailscale git python-websockify

      - name: Start Tailscale Service
        run: |
          sudo brew services start tailscale
          sleep 3

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-mac-${{ github.run_id }} --accept-routes
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Error: Failed to get Tailscale IP."
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: Set Runner Password
        run: |
          sudo sysadminctl -adminUser runner -adminPassword "" -setPassword -user runner -newPassword "password123" || true

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo launchctl kickstart -k system/com.apple.screensharing || true

      - name: Setup and Start noVNC (Web VNC)
        run: |
          # Скачиваем официальный noVNC клиент
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          
          # Запускаем websockify в фоне, который проксирует порт 6080 в локальный VNC (5900)
          python3 /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &

      - name: Connection Details & Keep Alive
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=== NOVNC BROWSER ACCESS ==="
          echo "Open this link in your browser (make sure you are connected to Tailscale):"
          echo "http://$TS_IP:6080/vnc.html?host=$TS_IP&port=6080"
          echo ""
          echo "Username:     runner"
          echo "Password:     password123"
          echo "==========================="
          sleep 21600
